name: Build LoveLink Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lovelink-frontend/capacitor.config.json'
      - 'lovelink-frontend/android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: lovelink-frontend
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        working-directory: lovelink-frontend
        env:
          CI: false
          REACT_APP_API_URL: https://lovelink-sfzx.onrender.com
          REACT_APP_WS_URL: wss://lovelink-sfzx.onrender.com
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: lovelink-frontend
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        working-directory: lovelink-frontend/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: lovelink-frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK to LoveLink.apk
        run: |
          mkdir -p output
          cp lovelink-frontend/android/app/build/outputs/apk/debug/app-debug.apk output/LoveLink.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveLink-Android-APK
          path: output/LoveLink.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "LoveLink Android App v1.0"
          body: |
            ### 💖 LoveLink Android APK v1.0
            Download and install `LoveLink.apk` directly on your Android phone!
            
            - 🔐 256-bit AES-GCM Client-Side End-to-End Encryption
            - 📹 Native WebRTC Video & Voice Calling
            - 🎮 Couple Chess, Ludo 1v1, Uno Card Game & Truth/Dare
            - 📍 Live Snap Map GPS & Battery Sharing
            - 💓 Heartbeat Touch Haptic Vibration
            - 🔄 **Over-the-Air Live Sync**: Automatically updates UI when new web features are deployed!
          files: output/LoveLink.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
