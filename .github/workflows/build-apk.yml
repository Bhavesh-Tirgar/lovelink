name: Build LoveLink Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lovelink-frontend/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: lovelink-frontend/package-lock.json

      - name: Install Frontend Dependencies & Sync Capacitor
        working-directory: lovelink-frontend
        env:
          CI: false
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Licenses & Install Android 36 SDK Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Grant Execute Permission to Gradlew
        working-directory: lovelink-frontend/android
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        working-directory: lovelink-frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Print Debug Keystore SHA-1 Fingerprint
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp lovelink-frontend/android/app/build/outputs/apk/debug/app-debug.apk output/LoveLink.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveLink-Android-APK
          path: output/LoveLink.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "LoveLink Android App Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: output/LoveLink.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
